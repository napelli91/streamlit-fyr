[project]
name = "streamlit-fyr"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nahuel Pelli", email = "nahuelpelli91@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "extra-streamlit-components>=0.1.81",
    "pandas>=2.0",
    "plotly>=5.0",
    "psycopg>=3.3.4",
    "sqlalchemy>=2.0",
    "streamlit>=1.57.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pytest>=9.0.3",
]
