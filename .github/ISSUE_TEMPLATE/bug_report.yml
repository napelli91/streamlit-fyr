name: Bug report
description: Something in streamlit-fyr is broken or behaves unexpectedly.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug! Please fill in as much of the
        below as you can — the smaller the repro, the faster we can fix it.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
      placeholder: e.g. `tracker.event(...)` raises IntegrityError when called before `init()`
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: A small Streamlit script (or test) that triggers the bug.
      render: python
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: streamlit-fyr version
      placeholder: "0.2.0"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "3.11.4"
    validations:
      required: true

  - type: dropdown
    id: backend
    attributes:
      label: Backend
      options:
        - SQLite
        - Postgres
        - Custom (subclass of Backend)
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Additional context
      description: Logs, screenshots, OS, environment variables — anything else that helps.
